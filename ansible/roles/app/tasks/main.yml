---
- name: Deploy DevOps application container
  community.docker.docker_container:
    name: "{{ container_name }}"
    image: "{{ docker_image }}"
    state: started
    restart_policy: unless-stopped
    recreate: true
    published_ports:
      - "{{ app_port }}:{{ app_port }}"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -f http://localhost:{{ app_port }}/ || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
